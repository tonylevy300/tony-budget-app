<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    
    <!-- PWA Meta Tags: Makes it look like a real native app when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#020617">
    
    <title>Daily HQ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { background-color: #020617; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-slate-200 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // --- Inline Icons ---
        const IconWallet = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>;
        const IconShield = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const IconTarget = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconCoffee = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>;
        const IconPlus = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconTrash = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconSettings = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconAlert = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const IconX = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconUpRight = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>;
        const IconDownRight = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></svg>;
        const IconCopy = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
        const IconTrendingUp = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>;

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            useEffect(() => {
                try { window.localStorage.setItem(key, JSON.stringify(storedValue)); } 
                catch (error) {}
            }, [key, storedValue]);
            return [storedValue, setStoredValue];
        }

        const QUICK_TAGS = ['🛒 Groceries', '🚕 Uber/Transport', '🍔 Takeout', '☕ Coffee', '⚡ Electricity'];

        function App() {
            const [transactions, setTransactions] = useLocalStorage('tony_transactions', []);
            const [config, setConfig] = useLocalStorage('tony_config', { flexBudget: 3000, dateOverride: '' });
            
            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');
            const [type, setType] = useState('flex');
            const [showSettings, setShowSettings] = useState(false);
            const [tempConfig, setTempConfig] = useState({ flexBudget: config.flexBudget, dateOverride: config.dateOverride, quickBalance: '' });

            // Robust Live Clock (Updates on focus/visibility change)
            const [realToday, setRealToday] = useState(new Date());
            useEffect(() => {
                const updateTime = () => setRealToday(new Date());
                window.addEventListener('focus', updateTime);
                window.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') updateTime();
                });
                const timer = setInterval(updateTime, 60000);
                return () => {
                    window.removeEventListener('focus', updateTime);
                    window.removeEventListener('visibilitychange', updateTime);
                    clearInterval(timer);
                };
            }, []);

            // Blueprint Constants
            const TARGETS = {
                fixed: 1627, 
                flex: config.flexBudget || 3000,
                vault: 4373 
            };

            // Date & Cycle Logic
            const today = config.dateOverride ? new Date(`${config.dateOverride}T12:00:00`) : realToday;
            const cycleStart = new Date(today);
            const cycleEnd = new Date(today);
            
            if (today.getDate() >= 24) {
                cycleStart.setDate(24);
                cycleEnd.setMonth(cycleEnd.getMonth() + 1);
                cycleEnd.setDate(23);
            } else {
                cycleStart.setMonth(cycleStart.getMonth() - 1);
                cycleStart.setDate(24);
                cycleEnd.setDate(23);
            }
            cycleStart.setHours(0, 0, 0, 0);
            cycleEnd.setHours(23, 59, 59, 999);

            const totalDaysInCycle = Math.max(1, Math.ceil((cycleEnd.getTime() - cycleStart.getTime()) / (1000 * 60 * 60 * 24)));
            const daysLeft = Math.max(1, Math.ceil((cycleEnd.getTime() - today.getTime()) / (1000 * 60 * 60 * 24)));
            const daysElapsed = totalDaysInCycle - daysLeft + 1; // Including today

            const currentMonthTx = transactions.filter(tx => {
                const txDate = new Date(tx.date);
                return txDate >= cycleStart && txDate <= cycleEnd;
            });

            const totals = currentMonthTx.reduce((acc, tx) => {
                if (tx.type === 'income' || tx.type === 'windfall') acc.income += tx.amount;
                else acc[tx.type] += tx.amount;
                return acc;
            }, { income: 0, flex: 0, fixed: 0, vault: 0 });

            // Pacing Math (Are you ahead or behind?)
            const flexRemaining = TARGETS.flex - totals.flex;
            const safeDailySpend = flexRemaining / daysLeft;
            const targetSpendByToday = (TARGETS.flex / totalDaysInCycle) * daysElapsed;
            const pacingDifference = targetSpendByToday - totals.flex; // Positive = Under budget (Good), Negative = Over budget (Bad)

            const handleAddTransaction = (e) => {
                e.preventDefault();
                if (!amount || isNaN(amount) || amount == 0) return;
                const newTx = {
                    id: Date.now().toString(), amount: parseFloat(amount), desc: desc || 'Categorized Item', type, date: today.toISOString()
                };
                setTransactions([newTx, ...transactions]);
                setAmount(''); setDesc('');
            };

            const handleDelete = (id) => setTransactions(transactions.filter(tx => tx.id !== id));

            const handleSaveSettings = () => {
                setConfig({ flexBudget: Number(tempConfig.flexBudget), dateOverride: tempConfig.dateOverride });
                if (tempConfig.quickBalance !== '') {
                    const desiredBalance = parseFloat(tempConfig.quickBalance);
                    const newFlexRemaining = Number(tempConfig.flexBudget) - totals.flex;
                    const diff = newFlexRemaining - desiredBalance;
                    if (diff !== 0 && !isNaN(diff)) {
                        setTransactions([{ id: Date.now().toString(), amount: diff, desc: 'System Balance Sync', type: 'flex', date: today.toISOString() }, ...transactions]);
                    }
                }
                setTempConfig({ ...tempConfig, quickBalance: '' });
                setShowSettings(false);
            };

            const exportData = () => {
                const dataStr = JSON.stringify({ transactions, config }, null, 2);
                navigator.clipboard.writeText(dataStr).then(() => {
                    alert("Data copied to clipboard! Paste it into your Notes app to back it up.");
                });
            };

            const formatZAR = (num) => new Intl.NumberFormat('en-ZA', { style: 'currency', currency: 'ZAR' }).format(num);

            return (
                <div className="min-h-screen bg-slate-950 text-slate-200 p-4 pb-20 md:p-8 flex justify-center relative">
                    <div className="max-w-md w-full space-y-6">
                        
                        {/* Header & Pacer Widget */}
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-emerald-500"></div>
                            
                            <div className="flex justify-between items-start mb-6">
                                <div>
                                    <h1 className="text-xl font-bold text-white flex items-center gap-3">
                                        Daily HQ
                                        <button onClick={() => {
                                            setTempConfig({ flexBudget: config.flexBudget, dateOverride: config.dateOverride, quickBalance: '' });
                                            setShowSettings(true);
                                        }} className="text-slate-500 hover:text-white transition-colors bg-slate-950 p-1.5 rounded-lg border border-slate-800">
                                            <IconSettings />
                                        </button>
                                    </h1>
                                    <p className="text-sm text-slate-300 mt-2 flex items-center gap-2 font-medium">
                                        {config.dateOverride ? (
                                            <span className="inline-block w-2 h-2 rounded-full bg-amber-500 shadow-[0_0_8px_rgba(245,158,11,0.8)]"></span>
                                        ) : (
                                            <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
                                        )}
                                        {today.toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long' })}
                                    </p>
                                    <p className="text-xs text-slate-500 mt-1 font-mono">
                                        CYCLE: {cycleStart.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' })} - {cycleEnd.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' })}
                                    </p>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs text-slate-500 uppercase tracking-widest font-semibold">Days Left</p>
                                    <p className="text-3xl font-bold text-white font-mono">{daysLeft}</p>
                                </div>
                            </div>

                            {/* Pacing Status Indicator */}
                            <div className="mb-4 flex items-center gap-2">
                                {pacingDifference >= 0 ? (
                                    <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1">
                                        <IconTrendingUp /> You are {formatZAR(pacingDifference)} under budget!
                                    </span>
                                ) : (
                                    <span className="bg-red-500/10 text-red-400 border border-red-500/20 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1">
                                        <IconAlert /> You are {formatZAR(Math.abs(pacingDifference))} over budget!
                                    </span>
                                )}
                            </div>

                            {/* The R100/Day Pacer */}
                            <div className={`p-5 rounded-2xl border ${safeDailySpend < 50 ? 'bg-red-950/30 border-red-900/50' : 'bg-blue-950/30 border-blue-900/50'}`}>
                                <p className="text-sm text-slate-300 mb-1 flex items-center gap-2">
                                    <IconCoffee /> Daily Spend Limit
                                </p>
                                <div className="flex items-end gap-2">
                                    <h2 className={`text-4xl font-bold font-mono tracking-tighter ${safeDailySpend < 50 ? 'text-red-400' : 'text-blue-400'}`}>
                                        {formatZAR(safeDailySpend)}
                                    </h2>
                                    <span className="text-slate-500 mb-1">/ day</span>
                                </div>
                                <p className="text-xs text-slate-400 mt-2">
                                    Total Flex Remaining: {formatZAR(flexRemaining)}
                                </p>
                            </div>
                        </div>

                        {/* Quick Add Form */}
                        <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-sm font-semibold text-white flex items-center gap-2"><IconPlus /> Log Expense</h2>
                            </div>
                            
                            {/* Quick Tags Scroll Bar */}
                            <div className="flex gap-2 overflow-x-auto pb-3 mb-1 hide-scroll">
                                {QUICK_TAGS.map(tag => (
                                    <button 
                                        key={tag} type="button" 
                                        onClick={() => { setDesc(tag); setType('flex'); }}
                                        className="whitespace-nowrap px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full text-xs font-medium border border-slate-700 transition-colors"
                                    >
                                        {tag}
                                    </button>
                                ))}
                            </div>

                            <form onSubmit={handleAddTransaction} className="space-y-3">
                                <div className="flex gap-2">
                                    <div className="relative flex-1">
                                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 font-bold">R</span>
                                        <input 
                                            type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00"
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-8 pr-4 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-mono" required
                                        />
                                    </div>
                                    <select 
                                        value={type} onChange={(e) => setType(e.target.value)}
                                        className="bg-slate-950 border border-slate-800 rounded-xl px-4 text-sm text-white focus:outline-none focus:border-blue-500"
                                    >
                                        <option value="flex">Flex</option>
                                        <option value="fixed">Fixed Cost</option>
                                        <option value="vault">Goal Savings</option>
                                        <option value="income">Payday (+)</option>
                                    </select>
                                </div>
                                <input 
                                    type="text" value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="What was it for?"
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
                                />
                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-900/50 active:scale-[0.98] transition-transform">
                                    Add Transaction
                                </button>
                            </form>
                        </div>

                        {/* The 3 Core Buckets */}
                        <div className="space-y-4">
                            <BucketProgress title="Survival / Flex" spent={totals.flex} target={TARGETS.flex} color="bg-blue-500" icon={<IconWallet />} />
                            <BucketProgress title="Fixed Costs" spent={totals.fixed} target={TARGETS.fixed} color="bg-slate-500" icon={<IconShield />} />
                            <BucketProgress title="Goal Savings" spent={totals.vault} target={TARGETS.vault} color="bg-emerald-500" icon={<IconTarget />} isVault={true} />
                        </div>

                        {/* Transaction History */}
                        <div className="pt-2">
                            <h2 className="text-xs font-semibold uppercase tracking-widest text-slate-500 ml-1 mb-3">Recent Logs</h2>
                            {currentMonthTx.length === 0 ? (
                                <div className="text-center py-8 text-slate-600 border border-dashed border-slate-800 rounded-2xl">
                                    <p className="text-sm">No transactions yet.</p>
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    {currentMonthTx.slice(0, 10).map(tx => (
                                        <div key={tx.id} className="flex items-center justify-between bg-slate-900 border border-slate-800 p-3 rounded-xl">
                                            <div className="flex items-center gap-3">
                                                <div className={`p-2 rounded-lg ${tx.type === 'income' ? 'bg-emerald-950/50 text-emerald-500' : tx.type === 'flex' ? 'bg-blue-950/50 text-blue-500' : tx.type === 'fixed' ? 'bg-slate-800 text-slate-400' : 'bg-purple-950/50 text-purple-500'}`}>
                                                    {(tx.type === 'income') ? <IconDownRight /> : <IconUpRight />}
                                                </div>
                                                <div>
                                                    <p className="text-sm font-semibold text-white">{tx.desc}</p>
                                                    <p className="text-xs text-slate-500 capitalize">{tx.type} • {new Date(tx.date).toLocaleDateString('en-ZA', { month: 'short', day: 'numeric' })}</p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3">
                                                <p className={`text-sm font-bold font-mono ${(tx.type === 'income') ? 'text-emerald-400' : 'text-slate-300'}`}>
                                                    {(tx.type === 'income') ? '+' : '-'}{formatZAR(tx.amount)}
                                                </p>
                                                <button onClick={() => handleDelete(tx.id)} className="text-slate-600 hover:text-red-500 p-1"><IconTrash /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Settings Modal */}
                    {showSettings && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-700 rounded-3xl w-full max-w-md p-6 shadow-2xl overflow-y-auto max-h-[90vh]">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-xl font-bold text-white flex items-center gap-2"><IconSettings /> System Config</h2>
                                    <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-white p-1"><IconX /></button>
                                </div>
                                
                                <div className="space-y-5">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Override Today's Date</label>
                                        <input type="date" value={tempConfig.dateOverride} onChange={(e) => setTempConfig({...tempConfig, dateOverride: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-white" />
                                    </div>
                                    
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Monthly Flex Budget</label>
                                        <input type="number" value={tempConfig.flexBudget} onChange={(e) => setTempConfig({...tempConfig, flexBudget: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 px-4 text-white font-mono" />
                                    </div>

                                    <div className="p-4 bg-blue-950/30 border border-blue-900/50 rounded-xl">
                                        <label className="block text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Quick Sync (Balance Match)</label>
                                        <input type="number" placeholder="Enter actual bank balance" value={tempConfig.quickBalance} onChange={(e) => setTempConfig({...tempConfig, quickBalance: e.target.value})} className="w-full bg-slate-950 border border-blue-900/50 rounded-xl py-3 px-4 text-white font-mono" />
                                    </div>

                                    <button onClick={handleSaveSettings} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg">Save & Update</button>
                                    
                                    <div className="border-t border-slate-800 pt-4 mt-2">
                                        <button onClick={exportData} className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl flex justify-center items-center gap-2 mb-3">
                                            <IconCopy /> Copy Backup Data
                                        </button>
                                        <button onClick={() => { if(window.confirm("Clear all transactions?")) { setTransactions([]); setShowSettings(false); } }} className="w-full bg-red-950/30 text-red-400 border border-red-900/50 font-bold py-3 rounded-xl flex justify-center items-center gap-2">
                                            <IconTrash /> Wipe Data
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function BucketProgress({ title, spent, target, color, icon, isVault = false }) {
            const progress = Math.min(100, Math.max(0, (spent / target) * 100));
            const formatZAR = (num) => new Intl.NumberFormat('en-ZA', { style: 'currency', currency: 'ZAR', minimumFractionDigits: 0 }).format(num);
            return (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <div className="flex justify-between items-end mb-2">
                        <div className="flex items-center gap-2"><div className="text-slate-400">{icon}</div><h3 className="text-sm font-bold text-slate-200">{title}</h3></div>
                        <div className="text-right"><span className={`text-sm font-bold ${isVault ? 'text-emerald-400' : 'text-white'}`}>{formatZAR(spent)}</span><span className="text-xs text-slate-500 ml-1">/ {formatZAR(target)}</span></div>
                    </div>
                    <div className="h-2 w-full bg-slate-950 rounded-full overflow-hidden border border-slate-800"><div className={`h-full transition-all duration-500 ease-out ${color}`} style={{ width: `${progress}%` }} /></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
