<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is CRUCIAL for mobile responsiveness and prevents input zooming -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Daily HQ - Financial Masterplan</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { 
            background-color: #020617; /* Tailwind slate-950 */
            -webkit-tap-highlight-color: transparent; /* Removes blue tap highlight on mobile */
        }
        /* Hide scrollbar for cleaner look */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-200 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- INLINE ICONS (Bulletproof) ---
        const IconWallet = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>;
        const IconShield = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const IconTarget = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
        const IconSettings = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconEdit = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
        const IconTrash = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconX = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;

        function App() {
            // --- STATE MANAGEMENT ---
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('hq_transactions') || '[]'));
            const [config, setConfig] = useState(() => JSON.parse(localStorage.getItem('hq_config') || '{"flexBudget": 3000, "fixedBudget": 4500, "vaultBudget": 1500}'));
            
            // Form State
            const [amount, setAmount] = useState('');
            const [desc, setDesc] = useState('');
            const [type, setType] = useState('flex');
            
            // UI State
            const [showSettings, setShowSettings] = useState(false);
            const [editId, setEditId] = useState(null);

            // Sync State
            const [syncAmount, setSyncAmount] = useState('');

            // Save to LocalStorage whenever data changes
            useEffect(() => {
                localStorage.setItem('hq_transactions', JSON.stringify(transactions));
                localStorage.setItem('hq_config', JSON.stringify(config));
            }, [transactions, config]);

            // --- CORE LOGIC (Pay Cycle 24th to 23rd) ---
            const today = new Date();
            let cycleStart = new Date(today.getFullYear(), today.getMonth(), 24);
            let cycleEnd = new Date(today.getFullYear(), today.getMonth() + 1, 23, 23, 59, 59);

            // If today is before the 24th, we are in the previous month's cycle
            if (today.getDate() < 24) {
                cycleStart = new Date(today.getFullYear(), today.getMonth() - 1, 24);
                cycleEnd = new Date(today.getFullYear(), today.getMonth(), 23, 23, 59, 59);
            }

            // Calculate exact days left (including today)
            const timeDiff = cycleEnd.getTime() - today.getTime();
            const daysLeft = Math.max(1, Math.ceil(timeDiff / (1000 * 3600 * 24)));

            // Filter transactions for this cycle only
            const currentCycleTx = transactions.filter(tx => {
                const txDate = new Date(tx.date);
                return txDate >= cycleStart && txDate <= cycleEnd;
            });

            // Tally up spending
            const totals = currentCycleTx.reduce((acc, tx) => {
                if (tx.type === 'income') return acc;
                acc[tx.type] = (acc[tx.type] || 0) + parseFloat(tx.amount);
                return acc;
            }, { flex: 0, fixed: 0, vault: 0 });

            // Daily Math
            const flexRemaining = config.flexBudget - totals.flex;
            const dailyAllowance = flexRemaining / daysLeft;

            // --- ACTIONS ---
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!amount || isNaN(amount)) return;

                if (editId) {
                    // Update existing
                    setTransactions(transactions.map(t => 
                        t.id === editId ? { ...t, amount: parseFloat(amount), desc, type } : t
                    ));
                    setEditId(null);
                } else {
                    // Add new
                    setTransactions([{
                        id: Date.now(), 
                        amount: parseFloat(amount), 
                        desc: desc || 'Untitled', 
                        type, 
                        date: new Date().toISOString()
                    }, ...transactions]);
                }
                // Reset form
                setAmount('');
                setDesc('');
                setType('flex');
            };

            const handleEdit = (tx) => {
                setEditId(tx.id);
                setAmount(tx.amount);
                setDesc(tx.desc);
                setType(tx.type);
                // Scroll to top where the form is
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleDelete = (id) => {
                if(confirm("Delete this transaction?")) {
                    setTransactions(transactions.filter(t => t.id !== id));
                }
            };

            const handleSync = () => {
                if (!syncAmount || isNaN(syncAmount)) return;
                
                // We want: config.flexBudget - totals.flex = syncAmount
                // Which means: current balance - syncAmount = adjustment needed
                const difference = flexRemaining - parseFloat(syncAmount);
                
                if (difference !== 0) {
                    setTransactions([{
                        id: Date.now(), 
                        amount: difference, 
                        desc: 'Bank Sync Adjustment', 
                        type: 'flex', 
                        date: new Date().toISOString()
                    }, ...transactions]);
                }
                setSyncAmount('');
                setShowSettings(false);
                alert("Bank balance synced!");
            };

            const handleSaveConfig = (e) => {
                e.preventDefault();
                setShowSettings(false);
            };

            // Formatting helper
            const formatZAR = (num) => new Intl.NumberFormat('en-ZA', { style: 'currency', currency: 'ZAR', maximumFractionDigits: 0 }).format(num);

            return (
                <div className="min-h-screen bg-slate-950 flex justify-center pb-20 sm:p-4 sm:pt-10">
                    <div className="w-full max-w-md bg-slate-950 sm:bg-slate-900 sm:border border-slate-800 sm:rounded-3xl sm:shadow-2xl overflow-hidden flex flex-col relative">
                        
                        {/* --- HEADER --- */}
                        <div className="p-6 pb-4 flex justify-between items-center bg-slate-900 sm:bg-transparent border-b border-slate-800 sm:border-0 sticky top-0 z-10">
                            <div>
                                <h1 className="text-2xl font-black text-white tracking-tight">Daily HQ</h1>
                                <p className="text-xs text-slate-400 font-medium tracking-wide uppercase">
                                    {cycleStart.toLocaleDateString('en-ZA', { month: 'short', day: 'numeric'})} - {cycleEnd.toLocaleDateString('en-ZA', { month: 'short', day: 'numeric'})}
                                </p>
                            </div>
                            <button 
                                onClick={() => setShowSettings(true)} 
                                className="p-3 bg-slate-800 hover:bg-slate-700 active:scale-90 rounded-xl text-slate-300 transition-all shadow-sm"
                            >
                                <IconSettings />
                            </button>
                        </div>

                        <div className="p-4 space-y-6">
                            
                            {/* --- DAILY BUDGET HERO --- */}
                            <div className="p-6 rounded-3xl bg-gradient-to-br from-indigo-900/40 to-blue-900/20 border border-indigo-500/20 shadow-inner">
                                <p className="text-sm text-indigo-300 font-medium mb-1">Today's Flex Budget</p>
                                <h2 className="text-5xl font-black text-white font-mono tracking-tighter mb-2">
                                    {formatZAR(dailyAllowance)}
                                </h2>
                                <div className="flex items-center text-sm font-medium text-slate-400 bg-slate-950/50 inline-flex px-3 py-1.5 rounded-lg border border-slate-800/50">
                                    <span className="text-blue-400 mr-2">●</span> {daysLeft} Days Remaining
                                </div>
                            </div>

                            {/* --- PROGRESS BARS --- */}
                            <div className="space-y-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
                                    <div className="flex justify-between items-end mb-2">
                                        <div className="flex items-center gap-2 font-bold text-blue-400"><IconWallet/> Flex</div>
                                        <div className="text-right"><span className="font-bold text-white">{formatZAR(totals.flex)}</span> <span className="text-xs text-slate-500">/ {formatZAR(config.flexBudget)}</span></div>
                                    </div>
                                    <div className="h-3 w-full bg-slate-950 rounded-full border border-slate-800 overflow-hidden"><div className="h-full bg-blue-500 rounded-full" style={{width: `${Math.min(100,(totals.flex/config.flexBudget)*100)}%`}}></div></div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
                                    <div className="flex justify-between items-end mb-2">
                                        <div className="flex items-center gap-2 font-bold text-slate-400"><IconShield/> Fixed</div>
                                        <div className="text-right"><span className="font-bold text-white">{formatZAR(totals.fixed)}</span> <span className="text-xs text-slate-500">/ {formatZAR(config.fixedBudget)}</span></div>
                                    </div>
                                    <div className="h-3 w-full bg-slate-950 rounded-full border border-slate-800 overflow-hidden"><div className="h-full bg-slate-500 rounded-full" style={{width: `${Math.min(100,(totals.fixed/config.fixedBudget)*100)}%`}}></div></div>
                                </div>

                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-sm">
                                    <div className="flex justify-between items-end mb-2">
                                        <div className="flex items-center gap-2 font-bold text-emerald-400"><IconTarget/> Goals</div>
                                        <div className="text-right"><span className="font-bold text-white">{formatZAR(totals.vault)}</span> <span className="text-xs text-slate-500">/ {formatZAR(config.vaultBudget)}</span></div>
                                    </div>
                                    <div className="h-3 w-full bg-slate-950 rounded-full border border-slate-800 overflow-hidden"><div className="h-full bg-emerald-500 rounded-full" style={{width: `${Math.min(100,(totals.vault/config.vaultBudget)*100)}%`}}></div></div>
                                </div>
                            </div>

                            {/* --- ADD/EDIT TRANSACTION FORM --- */}
                            <form onSubmit={handleSubmit} className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-lg">
                                <h3 className="text-lg font-bold text-white mb-2">{editId ? 'Edit Transaction' : 'Add Expense'}</h3>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    <input 
                                        type="number" 
                                        inputMode="decimal"
                                        value={amount} 
                                        onChange={e=>setAmount(e.target.value)} 
                                        placeholder="Amount (R)" 
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                                    />
                                    <select 
                                        value={type} 
                                        onChange={e=>setType(e.target.value)} 
                                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white font-medium appearance-none focus:outline-none focus:border-indigo-500 transition-colors"
                                    >
                                        <option value="flex">Flex</option>
                                        <option value="fixed">Fixed</option>
                                        <option value="vault">Goal</option>
                                    </select>
                                </div>
                                <input 
                                    type="text" 
                                    value={desc} 
                                    onChange={e=>setDesc(e.target.value)} 
                                    placeholder="What was this for?" 
                                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-white font-medium focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                                />
                                <div className="flex gap-2">
                                    {editId && (
                                        <button 
                                            type="button" 
                                            onClick={() => { setEditId(null); setAmount(''); setDesc(''); setType('flex'); }} 
                                            className="w-1/3 bg-slate-800 text-slate-300 py-4 rounded-xl font-bold active:scale-95 transition-all"
                                        >
                                            Cancel
                                        </button>
                                    )}
                                    <button 
                                        type="submit" 
                                        className={`${editId ? 'w-2/3' : 'w-full'} bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-xl font-bold text-lg active:scale-95 transition-all shadow-lg shadow-indigo-900/50`}
                                    >
                                        {editId ? 'Save Changes' : 'Add to Ledger'}
                                    </button>
                                </div>
                            </form>

                            {/* --- TRANSACTION LIST --- */}
                            <div className="space-y-3 pb-8">
                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-wider ml-1">Recent Transactions</h3>
                                {currentCycleTx.length === 0 ? (
                                    <p className="text-slate-500 text-center py-4">No transactions yet this cycle.</p>
                                ) : (
                                    currentCycleTx.map(t => (
                                        <div key={t.id} className="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm">
                                            <div className="flex flex-col overflow-hidden mr-2">
                                                <span className="font-semibold text-slate-200 truncate">{t.desc}</span>
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span className={`text-xs px-2 py-0.5 rounded-md font-bold uppercase tracking-wider ${
                                                        t.type === 'flex' ? 'bg-blue-500/20 text-blue-400' :
                                                        t.type === 'fixed' ? 'bg-slate-500/20 text-slate-400' :
                                                        'bg-emerald-500/20 text-emerald-400'
                                                    }`}>{t.type}</span>
                                                    <span className="text-xs text-slate-500">{new Date(t.date).toLocaleDateString('en-ZA', { month: 'short', day: 'numeric'})}</span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3 shrink-0">
                                                <span className="font-bold text-white text-lg">{formatZAR(t.amount)}</span>
                                                <div className="flex gap-1 ml-1 border-l border-slate-800 pl-2">
                                                    <button onClick={() => handleEdit(t)} className="p-2 text-slate-400 hover:text-white bg-slate-800 rounded-lg active:scale-90 transition-all"><IconEdit /></button>
                                                    <button onClick={() => handleDelete(t.id)} className="p-2 text-red-400 hover:text-red-300 bg-red-950/30 rounded-lg active:scale-90 transition-all"><IconTrash /></button>
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        {/* --- FULL SCREEN SETTINGS MODAL --- */}
                        {showSettings && (
                            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-4">
                                <div className="w-full max-w-md bg-slate-900 sm:rounded-3xl rounded-t-3xl border-t sm:border border-slate-800 p-6 shadow-2xl animate-[slideUp_0.2s_ease-out]">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-bold text-white">App Settings</h2>
                                        <button onClick={() => setShowSettings(false)} className="p-2 bg-slate-800 rounded-full text-slate-400 active:scale-90"><IconX /></button>
                                    </div>

                                    <div className="space-y-6">
                                        {/* Quick Sync */}
                                        <div className="bg-slate-950 p-5 rounded-2xl border border-slate-800">
                                            <h3 className="text-sm font-bold text-blue-400 mb-2">Quick Sync (Flex)</h3>
                                            <p className="text-xs text-slate-400 mb-3">Does your app not match your bank? Enter your actual Flex balance below to auto-correct the math.</p>
                                            <div className="flex gap-2">
                                                <input 
                                                    type="number" 
                                                    value={syncAmount} 
                                                    onChange={e=>setSyncAmount(e.target.value)} 
                                                    placeholder="Actual Bank Balance" 
                                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white"
                                                />
                                                <button onClick={handleSync} className="bg-blue-600 text-white px-4 rounded-xl font-bold active:scale-95">Sync</button>
                                            </div>
                                        </div>

                                        {/* Budgets */}
                                        <form onSubmit={handleSaveConfig} className="space-y-4">
                                            <h3 className="text-sm font-bold text-slate-300">Monthly Targets</h3>
                                            <div>
                                                <label className="text-xs text-slate-500 mb-1 block">Total Flex Budget (R)</label>
                                                <input type="number" value={config.flexBudget} onChange={e=>setConfig({...config, flexBudget: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"/>
                                            </div>
                                            <div>
                                                <label className="text-xs text-slate-500 mb-1 block">Total Fixed Budget (R)</label>
                                                <input type="number" value={config.fixedBudget} onChange={e=>setConfig({...config, fixedBudget: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"/>
                                            </div>
                                            <div>
                                                <label className="text-xs text-slate-500 mb-1 block">Total Goals/Vault (R)</label>
                                                <input type="number" value={config.vaultBudget} onChange={e=>setConfig({...config, vaultBudget: Number(e.target.value)})} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"/>
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold mt-4 active:scale-95 text-lg">Save Settings</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</body>
</html>
